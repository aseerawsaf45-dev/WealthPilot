<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <rect width="1600" height="1060" fill="#ffffff"/>
  <text x="800" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#0F172A">WealthPilot — System Architecture</text>
  <text x="800" y="80" text-anchor="middle" font-size="17" fill="#475569">One Next.js 16 application: React 19 client + App Router route handlers (the API) + server layer + Prisma on Neon Postgres</text>

  <!-- Client -->
  <rect x="60" y="110" width="1480" height="190" rx="16" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="84" y="142" font-size="20" font-weight="700" fill="#1D4ED8">Browser (React 19 client)</text>
  <g font-size="15" fill="#0F172A">
    <rect x="84" y="160" width="270" height="118" rx="10" fill="#fff" stroke="#93C5FD"/>
    <text x="100" y="186" font-weight="700">Pages / tabs</text>
    <text x="100" y="210">Overview · Transactions · Accounts</text>
    <text x="100" y="232">Budgets · Goals · Bills · Planner</text>
    <text x="100" y="254">Copilot · Learn · Import · Admin</text>
    <rect x="374" y="160" width="270" height="118" rx="10" fill="#fff" stroke="#93C5FD"/>
    <text x="390" y="186" font-weight="700">FinanceContext</text>
    <text x="390" y="210">GET /bootstrap once, then every</text>
    <text x="390" y="232">action calls the API and applies</text>
    <text x="390" y="254">the server's response</text>
    <rect x="664" y="160" width="270" height="118" rx="10" fill="#fff" stroke="#93C5FD"/>
    <text x="680" y="186" font-weight="700">On-device processing</text>
    <text x="680" y="210">CSV / XLSX / PDF text / OCR</text>
    <text x="680" y="232">(tesseract.js, pdf.js, SheetJS)</text>
    <text x="680" y="254">files never uploaded</text>
    <rect x="954" y="160" width="270" height="118" rx="10" fill="#fff" stroke="#93C5FD"/>
    <text x="970" y="186" font-weight="700">Shared deterministic libs</text>
    <text x="970" y="210">src/lib/ml · src/lib/planning</text>
    <text x="970" y="232">money (integer minor units), fx</text>
    <text x="970" y="254">same code in browser and server</text>
    <rect x="1244" y="160" width="272" height="118" rx="10" fill="#fff" stroke="#93C5FD"/>
    <text x="1260" y="186" font-weight="700">Privacy on device</text>
    <text x="1260" y="210">GPS distance (haversine) stays</text>
    <text x="1260" y="232">in the browser; HttpOnly session</text>
    <text x="1260" y="254">cookie, no token in JS</text>
  </g>

  <line x1="800" y1="300" x2="800" y2="350" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="815" y="332" font-size="15" fill="#334155">HTTPS · JSON · same-origin · SameSite=Lax cookie</text>

  <!-- API -->
  <rect x="60" y="355" width="1480" height="150" rx="16" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <text x="84" y="387" font-size="20" font-weight="700" fill="#15803D">API — Next.js App Router route handlers  /api/v1/**  (54 route files)</text>
  <g font-size="15" fill="#0F172A">
    <text x="84" y="418">auth · accounts · transactions (+import, rollback, recategorize) · budgets · goals (+contributions, plan) · bills (+pay) · debts</text>
    <text x="84" y="443">investments · loans (+take) · macro · banks · markets · fx · insights · reports · offers (+event) · user (preferences, export, data, ai-consent)</text>
    <text x="84" y="468">ai (copilot, page-insight, extract, bank-brief, conversations) · admin (offers, partners, stats) · audit · health · bootstrap</text>
    <text x="84" y="493" fill="#15803D" font-weight="700">Every handler: handle() → origin check → authed() session → Zod parseBody → rate limit → repo → ok()/fail()</text>
  </g>

  <line x1="800" y1="505" x2="800" y2="545" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- Server layer -->
  <rect x="60" y="550" width="1000" height="300" rx="16" fill="#FFF7ED" stroke="#F97316" stroke-width="2"/>
  <text x="84" y="582" font-size="20" font-weight="700" fill="#C2410C">Server layer  src/server</text>
  <g font-size="15" fill="#0F172A">
    <rect x="84" y="598" width="300" height="230" rx="10" fill="#fff" stroke="#FDBA74"/>
    <text x="100" y="624" font-weight="700">Platform</text>
    <text x="100" y="650">http.ts — envelopes, CSRF, session,</text>
    <text x="100" y="672">  adminOnly (ADMIN_EMAILS)</text>
    <text x="100" y="696">schemas.ts — Zod trust boundary</text>
    <text x="100" y="720">rateLimit.ts — atomic upsert window</text>
    <text x="100" y="744">audit.ts — SHA-256 hash chain,</text>
    <text x="100" y="766">  per-user advisory lock</text>
    <text x="100" y="790">mappers.ts — BigInt → number,</text>
    <text x="100" y="812">  derived balances</text>
    <rect x="404" y="598" width="300" height="230" rx="10" fill="#fff" stroke="#FDBA74"/>
    <text x="420" y="624" font-weight="700">Repositories (tenant-scoped)</text>
    <text x="420" y="650">ledger · planning · wealth · user</text>
    <text x="420" y="674">offers · copilot · insights</text>
    <text x="420" y="698">macro · banks · markets · fx</text>
    <text x="420" y="722">externalCache (memo → in-flight</text>
    <text x="420" y="744">  → DB row → fetch → stale)</text>
    <text x="420" y="770" fill="#C2410C">Every query: where { userId: session }</text>
    <text x="420" y="792" fill="#C2410C">Every write: $transaction + audit</text>
    <rect x="724" y="598" width="314" height="230" rx="10" fill="#fff" stroke="#FDBA74"/>
    <text x="740" y="624" font-weight="700">AI copilot  src/server/ai</text>
    <text x="740" y="650">router — keyword intents, no LLM</text>
    <text x="740" y="674">tools — server computes every number</text>
    <text x="740" y="698">commands — proposals, user confirms</text>
    <text x="740" y="722">orchestrator — {{fN}} placeholders,</text>
    <text x="740" y="744">  stray-digit grounding guard</text>
    <text x="740" y="768">privacy — redaction, consent version</text>
    <text x="740" y="792">gate — quotas · providers — Groq,</text>
    <text x="740" y="814">  optional Gemini backup</text>
  </g>

  <!-- External -->
  <rect x="1090" y="550" width="450" height="300" rx="16" fill="#FAF5FF" stroke="#A855F7" stroke-width="2"/>
  <text x="1114" y="582" font-size="20" font-weight="700" fill="#7E22CE">External services (outbound only)</text>
  <g font-size="15" fill="#0F172A">
    <text x="1114" y="614" font-weight="700">Public data — no user data sent</text>
    <text x="1114" y="638">World Bank WDI/WGI (country macro)</text>
    <text x="1114" y="660">Wikidata SPARQL (banks) + bundled snapshot</text>
    <text x="1114" y="682">GDELT DOC API (bank news, throttled)</text>
    <text x="1114" y="704">Yahoo Finance chart API (fund history)</text>
    <text x="1114" y="726">open.er-api.com (FX rates)</text>
    <text x="1114" y="762" font-weight="700">LLM — opt-in, redacted labels only</text>
    <text x="1114" y="786">Groq (Zero Data Retention)</text>
    <text x="1114" y="808">Gemini (backup; blocked for EEA/UK/CH/CN)</text>
  </g>
  <line x1="1060" y1="700" x2="1088" y2="700" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>

  <line x1="560" y1="850" x2="560" y2="895" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="575" y="880" font-size="15" fill="#334155">Prisma 6 (pooled) · BigInt money · interactive transactions</text>

  <!-- DB -->
  <rect x="60" y="900" width="1000" height="130" rx="16" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  <text x="84" y="932" font-size="20" font-weight="700" fill="#334155">Neon Postgres  (24 tables, 9 migrations; branch per test run)</text>
  <g font-size="15" fill="#0F172A">
    <text x="84" y="962">users · sessions · financial_accounts · transactions · transaction_splits · budget_categories · savings_goals</text>
    <text x="84" y="986">bill_subscriptions · debt_accounts · investment_plans · loan_offers · audit_events · rate_limit_buckets · merchant_rules</text>
    <text x="84" y="1010">copilot_* · page_insights · fx_snapshots · country_macros · external_cache · partners · offers · offer_locations · offer_stats</text>
  </g>
  <rect x="1090" y="900" width="450" height="130" rx="16" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  <text x="1114" y="932" font-size="20" font-weight="700" fill="#334155">Hosting</text>
  <g font-size="15" fill="#0F172A">
    <text x="1114" y="962">Hostinger Node.js (next build / next start</text>
    <text x="1114" y="984">  via scripts/next-prod.mjs, NODE_ENV forced)</text>
    <text x="1114" y="1008">Security headers: CSP, X-Frame-Options DENY</text>
  </g>
</svg>
